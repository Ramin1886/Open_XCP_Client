# SPDX-License-Identifier: GPL-2.0-only
# cargo-deny configuration (run locally with `cargo deny check`; not yet enforced in CI).

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Licences compatible with this project's GPL-2.0-only.
allow = [
    "GPL-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
