# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "open_xcp_client"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-2.0-only"
description = "Lightweight XCP on Ethernet (UDP/TCP) measurement logging (.sdf) and calibration client for XCPlite targets"
repository = "https://github.com/Ramin1886/Open_XCP_Client"
readme = "README.md"
keywords = ["xcp", "a2l", "adas", "calibration", "measurement"]
categories = ["science", "embedded", "network-programming", "gui"]

[lib]
name = "open_xcp_client"
path = "src/lib.rs"

[[bin]]
name = "open_xcp_client"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29"
tokio = { version = "1.40", features = ["rt", "net", "time", "sync", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
crossbeam-channel = "0.5"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.12"
# `macros` only for `#[tokio::test]`; the library itself builds a current-thread runtime by hand.
tokio = { version = "1.40", features = ["macros", "rt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[workspace]
members = [".", "tools/xcp_devtool"]
resolver = "2"
