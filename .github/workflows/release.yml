# SPDX-License-Identifier: GPL-2.0-only
name: Build & Release Binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Self-Contained Linux Binary (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: open_xcp_client-linux-x86_64
          path: target/release/open_xcp_client

  build-windows:
    name: Build Self-Contained Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --locked

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: open_xcp_client-windows-x86_64
          path: target/release/open_xcp_client.exe

  publish-release:
    name: Publish GitHub Release (on tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: open_xcp_client-linux-x86_64
          path: dist/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: open_xcp_client-windows-x86_64
          path: dist/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux/open_xcp_client
            dist/windows/open_xcp_client.exe
          generate_release_notes: true
